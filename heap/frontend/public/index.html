<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -- GA4 property G-FFR08ZC8CN, the one attached to
         the heap-4b852 Firebase project. The previous property, G-W7FSZHKXKC,
         was deleted in the Firebase console on 2026-10-08, so every hit this
         page sent was going nowhere.

         send_page_view is OFF here on purpose. This is a single-page app: gtag
         fires its page_view once, when this script loads, and never again,
         because React Router changes the URL through history.pushState. Page
         views are sent from src/lib/analytics.js instead, on every route
         change including the first. Turning this back on double-counts the
         landing page. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FFR08ZC8CN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-FFR08ZC8CN', { send_page_view: false });
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <!-- Light only. Declared here as well as on <html> from App.js so the
         browser paints its own chrome light before React runs, rather than
         flashing dark form controls on a dark-mode device. -->
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="HEAP: how 169 lifestyle and environmental exposures are reflected in 2,686 plasma proteins across 53,014 UK Biobank participants, with genetic and interventional evidence on each link."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>HEAP — Human Exposomic Architecture of the Proteome</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
