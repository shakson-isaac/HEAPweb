name: Deploy Frontend to Firebase Hosting

on:
  workflow_run:
    workflows: ["Deploy Backend to Google Cloud Run"]
    types:
      - completed
  push:
    # Only the default branch deploys. Without this, a push to ANY
    # branch touching these paths would redeploy the live site.
    branches:
      - main
    paths:
      - 'heap/frontend/**'
      - '.github/workflows/deploy-firebase.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Authenticate with Google Cloud (for Google Cloud services)
    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    # Step 3: Set up Firebase CLI
    - name: Set up Firebase CLI
      run: |
        # Installed from the npm registry, not the firebase.tools shell
        # installer. That installer downloads a versioned binary from
        # firebase.tools/bin/..., and on 2026-08-27 that URL served a
        # "Not Found" BODY with a success status -- which the script happily
        # wrote to /usr/local/bin/firebase and chmod +x'd, so the deploy failed
        # with "line 1: Not: command not found". Piping curl -sL to bash cannot
        # tell a binary from an error page.
        npm install -g firebase-tools@^15
        # Fail here, loudly, rather than at deploy time.
        firebase --version

    # Step 4: Install Node.js and dependencies
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22' # Update to Node.js 22

    # Step 5: Install dependencies
    - name: Install dependencies
      run: |
        cd heap/frontend  # Navigate to the frontend directory
        npm install  # Install the app dependencies
    
    # Step 5.1:
    - name: Create .env file with backend URL
      run: |
        cd heap/frontend  # Navigate to the frontend directory
        echo "REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL }}" > .env
        # Sharded result payloads, published from O2 by tools/sync_gcs.py.
        # Public bucket, so this is not a secret; the secret only exists so the
        # bucket can be moved without editing the frontend.
        echo "REACT_APP_WEB_DATA_URL=${{ secrets.REACT_APP_WEB_DATA_URL || 'https://storage.googleapis.com/heap-data/web/v1' }}" >> .env
        cat .env
  
    # Step 6: Build React app
    - name: Build React app
      run: |
        cd heap/frontend  # Navigate to the frontend directory
        npm run build  # This creates the static files in 'build' folder

    # Step 7: Firebase Deployment
    - name: Deploy to Firebase Hosting
      run: |
        cd heap/frontend  # Navigate to the frontend directory
        # Uses the service account from google-github-actions/auth above, not a
        # deprecated `firebase login:ci` token.
        firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }}
